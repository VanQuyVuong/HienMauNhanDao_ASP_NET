server {
    listen 80;
    server_name localhost;

    # Nơi chứa mã nguồn (thư mục dist)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Quan trọng: Nếu truy cập đường dẫn không tồn tại file, chuyển về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp các request /api sang Backend Container
    location /api/ {
        # 'backend' chính là tên service trong docker-compose.yml, cổng 8080 là cổng trong container
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bật nén gzip để tải trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
