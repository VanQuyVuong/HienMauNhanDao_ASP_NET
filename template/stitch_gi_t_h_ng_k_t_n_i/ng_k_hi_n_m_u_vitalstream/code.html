<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Blood Donation Registration - VitalStream</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-surface-variant": "#5b403f",
                      "tertiary-container": "#5f759b",
                      "primary": "#b7102a",
                      "secondary-container": "#fdd5e4",
                      "error": "#ba1a1a",
                      "surface-container-lowest": "#ffffff",
                      "error-container": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed": "#410007",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#001b3c",
                      "surface-container-low": "#f3f4f5",
                      "surface-variant": "#e1e3e4",
                      "inverse-surface": "#2e3132",
                      "tertiary-fixed": "#d5e3ff",
                      "primary-fixed-dim": "#ffb3b1",
                      "surface-bright": "#f8f9fa",
                      "outline": "#8f6f6e",
                      "on-tertiary-fixed-variant": "#30476a",
                      "background": "#f8f9fa",
                      "surface": "#f8f9fa",
                      "on-secondary-fixed-variant": "#5b3f4b",
                      "on-surface": "#191c1d",
                      "surface-container-high": "#e7e8e9",
                      "surface-dim": "#d9dadb",
                      "surface-container-highest": "#e1e3e4",
                      "on-error": "#ffffff",
                      "on-primary-fixed-variant": "#92001c",
                      "on-secondary-container": "#795a67",
                      "on-secondary-fixed": "#2b141f",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#ffb3b1",
                      "inverse-on-surface": "#f0f1f2",
                      "secondary": "#745662",
                      "outline-variant": "#e4bebc",
                      "surface-container": "#edeeef",
                      "tertiary-fixed-dim": "#b0c7f1",
                      "on-secondary": "#ffffff",
                      "tertiary": "#465d81",
                      "secondary-fixed": "#ffd8e7",
                      "surface-tint": "#bb152c",
                      "primary-container": "#db313f",
                      "on-background": "#191c1d",
                      "on-primary-container": "#fffbff",
                      "on-tertiary-container": "#fefcff",
                      "secondary-fixed-dim": "#e3bccb",
                      "primary-fixed": "#ffdad8"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "sm": "8px",
                      "lg": "24px",
                      "gutter-mobile": "12px",
                      "md": "16px",
                      "xl": "32px",
                      "base": "4px",
                      "xs": "4px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "caption": ["Inter"]
              },
              "fontSize": {
                      "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "caption": ["11px", {"lineHeight": "14px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .custom-radio:checked + div {
            border-color: #b7102a;
            background-color: #fdd5e4;
        }
        .custom-radio:checked + div span.material-symbols-outlined {
            color: #b7102a;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface border-b border-surface-container flex justify-between items-center px-margin-mobile py-sm z-40">
<button class="text-on-surface-variant p-2 -ml-2 rounded-full hover:bg-surface-container-low active:scale-95 transition-transform duration-100 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface text-center flex-1 pr-10">Registration</h1>
</header>
<main class="flex-1 px-margin-mobile pt-lg pb-[100px] flex flex-col gap-xl max-w-lg mx-auto w-full">
<!-- Step Indicator -->
<div class="flex items-center justify-between w-full">
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-lg text-label-lg">1</div>
<span class="font-caption text-caption text-primary">Details</span>
</div>
<div class="flex-1 h-px bg-surface-variant mx-2 mt-[-20px]"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-label-lg text-label-lg">2</div>
<span class="font-caption text-caption text-on-surface-variant">Health</span>
</div>
<div class="flex-1 h-px bg-surface-variant mx-2 mt-[-20px]"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-label-lg text-label-lg">3</div>
<span class="font-caption text-caption text-on-surface-variant">Confirm</span>
</div>
</div>
<div class="flex flex-col gap-lg">
<!-- Campaign Selection -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-on-surface">Select Campaign</h2>
<div class="relative w-full border border-outline rounded-lg bg-surface-container-lowest focus-within:border-primary focus-within:ring-1 focus-within:ring-primary overflow-hidden">
<select class="w-full appearance-none bg-transparent py-3 pl-4 pr-10 font-body-md text-body-md text-on-surface focus:outline-none">
<option value="city-hall">City Hall Blood Drive (Today)</option>
<option value="central-hospital">Central Hospital Emergency Appeal</option>
<option value="community-center">Community Center Mobile Clinic</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</section>
<!-- Blood Volume -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-on-surface">Donation Volume</h2>
<div class="grid grid-cols-3 gap-3">
<label class="relative cursor-pointer">
<input class="custom-radio sr-only" name="volume" type="radio" value="250"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline rounded-lg bg-surface-container-lowest transition-colors h-full">
<span class="material-symbols-outlined mb-1 text-outline" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-lg text-label-lg text-on-surface text-center">250 ml</span>
</div>
</label>
<label class="relative cursor-pointer">
<input checked="" class="custom-radio sr-only" name="volume" type="radio" value="350"/>
<div class="flex flex-col items-center justify-center p-3 border border-primary bg-secondary-container rounded-lg transition-colors h-full">
<span class="material-symbols-outlined mb-1 text-primary" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-lg text-label-lg text-on-surface text-center">350 ml</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="custom-radio sr-only" name="volume" type="radio" value="450"/>
<div class="flex flex-col items-center justify-center p-3 border border-outline rounded-lg bg-surface-container-lowest transition-colors h-full">
<span class="material-symbols-outlined mb-1 text-outline" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-lg text-label-lg text-on-surface text-center">450 ml</span>
</div>
</label>
</div>
<p class="font-caption text-caption text-on-surface-variant mt-1">Standard recommendation based on average height/weight.</p>
</section>
<!-- Time Slot -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-on-surface">Available Time Slots</h2>
<div class="grid grid-cols-4 gap-2">
<button class="py-2 border border-outline rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low focus:border-primary focus:bg-secondary-container focus:text-on-surface transition-colors">09:00</button>
<button class="py-2 border border-outline rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low focus:border-primary focus:bg-secondary-container focus:text-on-surface transition-colors">09:30</button>
<button class="py-2 border border-primary rounded-lg bg-secondary-container font-body-md text-body-md text-on-surface transition-colors">10:00</button>
<button class="py-2 border border-outline rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low focus:border-primary focus:bg-secondary-container focus:text-on-surface transition-colors">10:30</button>
<button class="py-2 border border-outline rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low focus:border-primary focus:bg-secondary-container focus:text-on-surface transition-colors">11:00</button>
<button class="py-2 border border-outline rounded-lg bg-surface-variant font-body-md text-body-md text-outline cursor-not-allowed opacity-50" disabled="">11:30</button>
<button class="py-2 border border-outline rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low focus:border-primary focus:bg-secondary-container focus:text-on-surface transition-colors">13:00</button>
<button class="py-2 border border-outline rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low focus:border-primary focus:bg-secondary-container focus:text-on-surface transition-colors">13:30</button>
</div>
</section>
</div>
</main>
<!-- Bottom Action Bar (Contextual FAB equivalent for forms) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-container p-margin-mobile pb-safe z-50 flex justify-end shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-lg font-label-lg text-label-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Next Step
            <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
